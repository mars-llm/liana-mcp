[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "liana-mcp"
version = "0.1.0a1"
description = "Experimental, local-only MCP tools for isolated Liana regtest wallets"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==2.3.0", "embit==0.8.0", "jsonschema>=4.26,<5"]

[project.scripts]
liana-mcp = "liana_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly configured local regtest binaries"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
